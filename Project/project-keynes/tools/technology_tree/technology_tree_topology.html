const NODE_W = 200, NODE_H = 56;
const MILESTONE_W = 260, MILESTONE_H = 74;
const MIN_LINE_CAP = 5;             // 窄屏下限，不足则横向滚动

const MIN_COL_GAP = 18;             // 行内最小水平间距
const MAX_SPREAD_GAP = NODE_W * 0.92; // 短行拉开的上限，避免两张卡飞到两端

const ROW_GAP = 40;                 // 依赖层之间的垂直间距（留给连线弧度）

const MILESTONE_PAD = 22;           // 里程碑独占行的上下留白
const BARYCENTRE_PASSES = 4;
const SVGNS = "http://www.w3.org/2000/svg";

function viewportMetrics() {
  const scroller = document.getElementById("scroller");
  const avail = Math.max(scroller ? scroller.clientWidth : 0, 720);
  const cap = Math.min(MAX_LINE_CAP, Math.max(MIN_LINE_CAP,
    Math.floor((avail - 2 * PAD_SIDE + MIN_COL_GAP) / (NODE_W + MIN_COL_GAP))));
  const packed = cap * NODE_W + (cap - 1) * MIN_COL_GAP + 2 * PAD_SIDE;
  const stageW = Math.max(avail, packed);
  const usable = stageW - 2 * PAD_SIDE;
  const colGap = cap > 1 ? (usable - cap * NODE_W) / (cap - 1) : MIN_COL_GAP;
  return { lineCap: cap, stageW, colGap, usable };
}

// Era is the primary layout boundary. Dependencies may cross an era boundary,
// but nodes never do. Inside an era, structural edges determine local layers;
// domain and branch-family order provide deterministic crossing reduction.
function layout(metrics) {
  const { lineCap, stageW, colGap, usable } = metrics;
  const placed = {};
  const depth = {};
  const eraBands = [];
  const domainRank = {};
  DATA.domains.forEach((domain, index) => { domainRank[domain.id] = index; });
  let y = PAD_TOP;
  const lineHeight = NODE_H + STAGGER_Y + 18;

  function placeLine(line, originY, wrapIndex) {
    const count = line.length;
    let gap, x0;
    if (count >= lineCap) {
      gap = colGap;
      x0 = PAD_SIDE;
    } else if (count === 1) {
      gap = 0;
      x0 = PAD_SIDE + (usable - NODE_W) / 2;
    } else {
      gap = Math.min(MAX_SPREAD_GAP,
        Math.max(MIN_COL_GAP, (usable - count * NODE_W) / (count - 1)));
      const lineWidth = count * NODE_W + (count - 1) * gap;
      x0 = PAD_SIDE + (usable - lineWidth) / 2;
    }
    line.forEach((node, index) => {
      const laneJitter = ((laneRank[node.layout_lane] || 0) % 3) * 4;
      const wrapJitter = (wrapIndex % 2) * 6;
      placed[node.id] = {
        x: x0 + index * (NODE_W + gap),
        y: originY + (index % 2) * STAGGER_Y + laneJitter + wrapJitter,
        h: NODE_H,
      };
    });
  }

  DATA.eras.forEach((era, eraIndex) => {
    const members = DATA.nodes.filter(node => node.era_id === era.id);
    const memberIds = new Set(members.map(node => node.id));
    const milestone = members.find(node => node.is_milestone) || null;
    const normals = members.filter(node => !node.is_milestone);
    const localDepth = {};
    const visit = (id, stack) => {
      if (localDepth[id] !== undefined) return localDepth[id];
      if (stack.has(id)) return 0;
      stack.add(id);
      let best = -1;
      incomingEdges[id]
        .filter(edge => STRUCTURAL_EDGE_KINDS.has(edge.kind)
          && memberIds.has(edge.from) && !nodesById[edge.from].is_milestone)
        .forEach(edge => { best = Math.max(best, visit(edge.from, stack)); });
      stack.delete(id);
      localDepth[id] = best + 1;
      depth[id] = eraIndex * 1000 + localDepth[id];
      return localDepth[id];
    };
    normals.forEach(node => visit(node.id, new Set()));

    const maxLocalDepth = normals.length
      ? Math.max(...normals.map(node => localDepth[node.id])) : -1;
    const rows = [];
    for (let layer = 0; layer <= maxLocalDepth; layer++)
      rows.push(normals.filter(node => localDepth[node.id] === layer));

    const indexInRow = {};
    rows.forEach(row => {
      row.sort((left, right) => {
        const leftDomain = domainRank[left.domain_id] ?? 99;
        const rightDomain = domainRank[right.domain_id] ?? 99;
        if (leftDomain !== rightDomain) return leftDomain - rightDomain;
        const leftLane = laneRank[left.layout_lane] ?? 9999;
        const rightLane = laneRank[right.layout_lane] ?? 9999;
        return leftLane !== rightLane ? leftLane - rightLane : left._order - right._order;
      });
      row.forEach((node, index) => { indexInRow[node.id] = index; });
    });
    const barycentre = (node, downward) => {
      const related = (downward ? incomingEdges[node.id] : outgoingEdges[node.id])
        .filter(edge => STRUCTURAL_EDGE_KINDS.has(edge.kind))
        .map(edge => downward ? edge.from : edge.to)
        .filter(id => memberIds.has(id) && indexInRow[id] !== undefined);
      if (!related.length) return indexInRow[node.id];
      return related.reduce((sum, id) => sum + indexInRow[id], 0) / related.length;
    };
    for (let pass = 0; pass < BARYCENTRE_PASSES; pass++) {
      const downward = pass % 2 === 0;
      const order = downward ? [...rows.keys()] : [...rows.keys()].reverse();
      order.forEach(rowIndex => {
        const row = rows[rowIndex];
        row.sort((left, right) => {
          const delta = barycentre(left, downward) - barycentre(right, downward);
          if (Math.abs(delta) > 0.4) return delta;
          const leftLane = laneRank[left.layout_lane] ?? 9999;
          const rightLane = laneRank[right.layout_lane] ?? 9999;
          return leftLane !== rightLane ? leftLane - rightLane : left._order - right._order;
        });
        row.forEach((node, index) => { indexInRow[node.id] = index; });
      });
    }

    const bandTop = y;
    y += ERA_PAD;
    rows.forEach(row => {
      let wrapIndex = 0;
      for (let start = 0; start < row.length; start += lineCap) {
        placeLine(row.slice(start, start + lineCap), y, wrapIndex);
        y += lineHeight + (start + lineCap < row.length ? LINE_GAP : 0);
        wrapIndex += 1;
      }
      y += ROW_GAP;
    });

    let milestoneTop = 0;
    let milestoneBottom = 0;
    if (milestone) {
      y += MILESTONE_PAD;
      milestoneTop = y - MILESTONE_PAD;
      placed[milestone.id] = {
        x: (stageW - MILESTONE_W) / 2, y, h: MILESTONE_H,
      };
      depth[milestone.id] = eraIndex * 1000 + maxLocalDepth + 1;
      y += MILESTONE_H;
      milestoneBottom = y + MILESTONE_PAD;
      y += MILESTONE_PAD;
    }
    const bandBottom = Math.max(y + ERA_PAD, bandTop + ERA_PAD * 2 + MILESTONE_H);
    eraBands.push({
      era, top: bandTop, bottom: bandBottom,
      milestoneId: milestone ? milestone.id : null,
      msTop: milestoneTop, msBottom: milestoneBottom,
    });
    y = bandBottom;
  });
  return { pos: placed, depth, eraBands, width: stageW, height: y + PAD_BOTTOM };
}

function validateEraPartition(result) {
  result.eraBands.forEach((band, index) => {
    if (index > 0 && result.eraBands[index - 1].bottom > band.top)
      throw new Error(`Era bands overlap: ${result.eraBands[index - 1].era.id} / ${band.era.id}`);
    DATA.nodes.filter(node => node.era_id === band.era.id).forEach(node => {
      const point = result.pos[node.id];
      if (!point || point.y < band.top || point.y + point.h > band.bottom)
        throw new Error(`Technology escaped era band: ${node.id} / ${band.era.id}`);
    });
  });
}

const edgeEls = [];
const EDGE_DRAW_ORDER = { alternative: 0, milestone_candidate: 1, application: 2, hard: 3 };
DATA.edges.slice().sort((a, b) => (EDGE_DRAW_ORDER[a.kind] ?? 0) - (EDGE_DRAW_ORDER[b.kind] ?? 0)).forEach(e => {
  if (nodesById[e.from] && nodesById[e.to] && isDrawnEdge(e)) edgeEls.push(drawEdge(e));
});

function isDrawnEdge(edge) {
  // 时代门已经由里程碑行表达；再从里程碑拉硬前置边会扇到整代科技。
  if (edge.kind === "hard" && nodesById[edge.from] && nodesById[edge.from].is_milestone) return false;
  return true;
}

function edgePathD(edge) {
  const fromId = edge.from || edge.dataset.from, toId = edge.to || edge.dataset.to;
  const a = pos[fromId], b = pos[toId];
  const aw = nodesById[fromId].is_milestone ? MILESTONE_W : NODE_W;
  const bw = nodesById[toId].is_milestone ? MILESTONE_W : NODE_W;
  const x1 = a.x + aw / 2, y1 = a.y + a.h, x2 = b.x + bw / 2, y2 = b.y;
  const dy = Math.max(22, Math.abs(y2 - y1) * 0.46);
  return `M ${x1} ${y1} C ${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`;
}

function drawEdge(edge) {
  const path = document.createElementNS(SVGNS, "path");
  path.setAttribute("d", edgePathD(edge));
  path.setAttribute("class", `edge ${edge.kind}`);
  path.dataset.from = edge.from; path.dataset.to = edge.to; path.dataset.kind = edge.kind;
  svg.appendChild(path);
  return path;
}

function updateEdgePath(path) {
  path.setAttribute("d", edgePathD(path));
}

// ── 链路高亮：前置追溯到时代里程碑为止，不穿过里程碑扇出整代科技 ──
function chainOf(id) {
  const hot = new Set([id]);
  const up = cid => incomingEdges[cid].filter(e => STRUCTURAL_EDGE_KINDS.has(e.kind)).forEach(e => {
    if (hot.has(e.from)) return;
    hot.add(e.from);
    if (nodesById[e.from].is_milestone) return;
    up(e.from);
  });
  const down = cid => {
    if (nodesById[cid].is_milestone) return;
    outgoingEdges[cid].filter(e => STRUCTURAL_EDGE_KINDS.has(e.kind)).forEach(e => {
      if (hot.has(e.to)) return;
      hot.add(e.to);
      down(e.to);
    });
  };
  up(id); down(id);
  [...incomingEdges[id], ...outgoingEdges[id]].forEach(e => {
    if (!STRUCTURAL_EDGE_KINDS.has(e.kind)) { hot.add(e.from); hot.add(e.to); }
  });
  return hot;
}

let selectedId = null;
function applyChain(id) {
  if (!id) { clearChain(); return; }
  const hot = chainOf(id);
  DATA.nodes.forEach(n => nodeEls[n.id].classList.toggle("dim", !hot.has(n.id)));
  edgeEls.forEach(e => {
    const incident = e.dataset.from === id || e.dataset.to === id;
    const onChain = hot.has(e.dataset.from) && hot.has(e.dataset.to);
    const visibleKind = edgeOn[e.dataset.kind] || incident;
    e.classList.toggle("dim", !(onChain && visibleKind));
    e.classList.toggle("hot", incident || (onChain && e.dataset.kind === "hard"));
    e.classList.toggle("focus-show", incident && !edgeOn[e.dataset.kind]);
  });
}
function clearChain() {
  DATA.nodes.forEach(n => nodeEls[n.id].classList.remove("dim"));
  edgeEls.forEach(e => e.classList.remove("dim", "hot", "focus-show"));
}

// ── 详情面板 ──
const detail = document.getElementById("detail");
const STAT_LABELS = [
  [/^country\.economy_output_factor$/, () => "全社会经济产出"],
  [/^country\.production\.input_factor$/, () => "全社会生产投入"],
  [/^country\.household\.consumption_factor$/, () => "全社会家庭消费"],
  [/^country\.resource\.use_factor$/, () => "全社会自然资源耗用"],
  [/^country\.output\.good\.([^.]+)_factor$/, m => `商品产出 · ${m[1]}`],
  [/^country\.input\.good\.([^.]+)_factor$/, m => `生产投入 · ${m[1]}`],
  [/^country\.consumption\.good\.([^.]+)_factor$/, m => `家庭消费 · ${m[1]}`],
  [/^country\.resource\.([^.]+)\.use_factor$/, m => `自然资源利用 · ${m[1]}`],
  [/^country\.resource\.([^.]+)\.managed_generation_factor$/, m => `资源再生 · ${m[1]}`],
  [/^country\.output\.(terrain|landform)\.([^.]+)\.([^.]+)_factor$/,
    m => `地理生产 · ${m[1]}.${m[2]} · ${m[3]}`],
  [/^country\.output\.family\.([^.]+)_factor$/, m => `生产家族产出 · ${m[1]}`],
  [/^country\.output\.building\.([^.]+)_factor$/, m => `指定建筑产出 · ${m[1]}`],
  [/^country\.output\.agriculture_factor$/, () => "农业部门产出"],
  [/^country\.output\.energy_factor$/, () => "能源部门产出"],
  [/^country\.trade\.capacity_factor$/, () => "国内贸易容量"],
  [/^country\.research\.institution_output_factor$/, () => "科研机构产出"],
  [/^country\.research\.cost_factor$/, () => "研究成本"],
  [/^country\.research\.agriculture_efficiency$/, () => "农业领域研究效率"],
  [/^country\.climate\.drought_loss_factor$/, () => "旱灾损失"],
  [/^country\.climate\.flood_loss_factor$/, () => "洪灾损失"],
  [/^country\.climate\.cold_stress_factor$/, () => "寒冷损害"],
  [/^country\.climate\.heat_stress_factor$/, () => "热害损失"],
];
function statLabel(key) {
  for (const [re, fn] of STAT_LABELS) { const m = key.match(re); if (m) return fn(m); }
  return key;
}

function termLabel(term) {
  return term.subject_display_name || statLabel(term.stat);
}

// 经济内容解锁与 ALL 支撑关系（来自 EconomyCatalog 权威反向绑定）
function renderUnlocks(u) {
  if (!u) return "";
  const group = (title, list) => list.length
    ? `<div class="unlock-group"><div class="unlock-title">${title}<span class="unlock-count">${list.length}</span></div>
       <div>${list.map(e => `<span class="unlock-chip" title="${e.id}">${esc(e.name)}</span>`).join("")}</div></div>`
    : "";
  const body = group("建筑", u.buildings) + group("物资", u.goods) + group("自然资源", u.resources);
  const support = group("作为 ALL 支撑条件参与的生产方式", u.support_buildings || []);
  return (body ? `<div class="d-sec"><h3>直接解锁</h3>${body}</div>` : "")
    + (support ? `<div class="d-sec"><h3>产业交汇</h3>${support}</div>` : "");
}

function renderContentEffects(effects) {
  if (!effects || !effects.length) return "";
  const rows = effects.map(e => `<div class="effect-row">
    <div class="effect-name">${esc(e.display_name || e.id || e.subject)}</div>
    <div class="effect-spec">${esc(e.kind)} · ${esc(e.attribute)} · ${esc(e.operation)} ${esc(e.value)} · ${esc(e.status)}</div>
  </div>`).join("");
  return `<div class="d-sec"><h3>结构化内容效果</h3>${rows}</div>`;
}

function renderOverview() {
  const rows = DATA.eras.map(era => {
    const cells = DATA.domains.map(dom => {
      const c = DATA.nodes.filter(n => n.era_id === era.id && n.domain_id === dom.id).length;
      return `<td class="cell${c ? "" : " zero"}" data-era="${era.id}" data-dom="${dom.id}">${c || "·"}</td>`;
    }).join("");
    return `<tr><td class="era-name">${era.display_name}</td>${cells}</tr>`;
  }).join("");
  detail.innerHTML = `
    <div class="d-kicker">TECHNOLOGY CATALOG</div>
    <h2 class="d-title" style="padding-left:0">分布总览</h2>
    <div class="d-sub" style="padding-left:0">${DATA.nodes.length} 项科技 · ${DATA.eras.length} 个时代 · ${DATA.domains.length} 个领域</div>
    <div class="d-sec"><h3>时代 × 领域 分布</h3>
      <table class="overview-table">
        <tr><th style="text-align:left">时代</th>${DATA.domains.map(d =>
          `<th><span style="color:${d.accent}">●</span> ${d.display_name}</th>`).join("")}</tr>
        ${rows}
      </table>
    </div>
    <div class="overview-note">
      当前权威目录 technology_network.json：361 节点，硬前置 303 条，替代可视边 698 条。<br>
      默认只画硬前置骨架。点选节点会临时显示它的替代/应用边；顶栏可打开全部边。Esc 清除高亮。
    </div>`;
  detail.querySelectorAll("td.cell").forEach(td => td.addEventListener("click", () => {
    focusEraDomain(td.dataset.era, td.dataset.dom);
  }));
}

function focusEraDomain(eraId, domId) {
  clearSelection();
  const hits = new Set(DATA.nodes.filter(n => n.era_id === eraId && n.domain_id === domId).map(n => n.id));
  DATA.nodes.forEach(n => nodeEls[n.id].classList.toggle("dim", !hits.has(n.id)));
  edgeEls.forEach(e => e.classList.add("dim"));
  const first = DATA.nodes.find(n => n.era_id === eraId);
  if (first) nodeEls[first.id].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}

function select(id) {
  selectedId = id;
  DATA.nodes.forEach(n => nodeEls[n.id].classList.toggle("selected", n.id === id));
  applyChain(id);
  renderDetail(nodesById[id]);
}
function clearSelection() {
  selectedId = null;
  DATA.nodes.forEach(n => nodeEls[n.id].classList.remove("selected", "dim"));
  clearChain();
}

function renderDetail(n) {
  const dom = domainsById[n.domain_id], era = erasById[n.era_id];
  const badges = [];
  if (n.is_starter_eligible) badges.push('<span class="badge enamel">区域开局候选</span>');
  if (n.is_milestone) badges.push('<span class="badge brass">时代里程碑</span>');
  if (!n.is_milestone && n.is_era_key) badges.push('<span class="badge brass">时代关键 · 里程碑候选</span>');
  (n.route_display_names && n.route_display_names.length ? n.route_display_names : n.route_tags)
    .forEach(t => badges.push(`<span class="badge">${esc(t)}</span>`));

  const inspiration = n.reveal_condition_lines.length
    ? n.reveal_condition_lines.map(l =>
        `<div class="cond-line" style="padding-left:${l.depth * 16}px">${l.depth ? "└ " : ""}${esc(l.text)}</div>`).join("")
    : '<div class="cond-line" style="color:var(--text-3)">无额外发现线索。</div>';

  const terms = n.modifier_terms.length
    ? n.modifier_terms.map(t => `<div class="term">
        <div class="t-head"><span class="t-label">${esc(termLabel(t))}</span><span class="t-val">${fmtTerm(t)}</span></div>
        <div class="t-key">${t.stat}</div>
        <div class="d-desc">${esc(t.effect_rationale || "")}</div>
        <div class="t-key">运行时消费者 · ${esc(t.runtime_consumer || "未声明")}</div></div>`).join("")
    : '<div class="cond-line" style="color:var(--text-3)">无数值效果（开局即完成）。</div>';

  const chip = (id, soft, tag) => {
    const t = nodesById[id];
    return `<span class="rel-chip${soft ? " soft" : ""}" data-goto="${id}">${t ? t.display_name : id}${tag ? `<span class="m">${tag}</span>` : ""}</span>`;
  };
  const relationList = (ids, reasons, soft, tag) => (ids || []).map((id, i) =>
    `<div class="cond-line">${chip(id, soft, tag)}${reasons && reasons[i] ?
      `<div class="d-desc" style="margin-top:4px">${esc(reasons[i])}</div>` : ""}</div>`).join("");
  const prereqs = relationList(n.prerequisite_ids, n.prerequisite_rationales, false, "") ||
    '<span style="color:var(--text-3)">无（时代入口）</span>';
  const hardSuccessors = outgoingEdges[n.id].filter(e => e.kind === "hard").map(e => e.to);
  const succs = relationList(hardSuccessors, n.hard_successor_rationales, false, "") ||
    '<span style="color:var(--text-3)">无（末端）</span>';
  const sameLane = relationList(n.branch_successor_ids, n.branch_successor_rationales, false, "主题") ||
    '<span style="color:var(--text-3)">无</span>';
  const applicationOut = relationList(n.application_target_ids,
    n.application_target_rationales, true, "应用");
  const applicationIn = incomingEdges[n.id].filter(e => e.kind === "application")
    .map(e => chip(e.from, true, "输入")).join("");
  const applicationBlock = applicationOut || applicationIn
    ? `<div class="d-sec"><h3>跨领域应用</h3><div>${applicationOut}${applicationIn}</div></div>` : "";
  const research = n.condition_lines && n.condition_lines.length
    ? n.condition_lines.map(l =>
        `<div class="cond-line" style="padding-left:${l.depth * 16}px">${l.depth ? "└ " : ""}${esc(l.text)}</div>`).join("")
    : '<div class="cond-line" style="color:var(--text-3)">无替代知识路径。</div>';
  const milestoneBlock = n.is_milestone
    ? `<div class="d-sec"><h3>里程碑候选 · 任选 ${n.milestone_required_count} 项</h3>` +
      n.milestone_candidate_ids.map(cid => chip(cid, true)).join("") + "</div>"
    : "";

  const unlockBlock = renderUnlocks(n.unlocks);

  detail.innerHTML = `
    <div class="d-kicker">${era.display_name} · ${dom.display_name}</div>
    <h2 class="d-title" style="border-left:3px solid ${dom.accent}">${n.display_name}</h2>
    <div class="d-sub" style="padding-left:13px">${n.id}</div>
    <div class="d-badges">${badges.join("")}</div>
    <div class="d-sec"><h3>基本信息</h3>
      <div class="kv"><span>研究成本</span><span>${n.cost_points.toLocaleString("zh-CN")} 科技值</span></div>
      <div class="kv"><span>效果档案</span><span style="font-family:var(--mono);font-size:11.5px">${n.effect_profile}</span></div>
      <div class="kv"><span>网络角色</span><span style="font-family:var(--mono);font-size:11.5px">${esc(n.network_role || "")}</span></div>
      <div class="kv"><span>锚点类型</span><span style="font-family:var(--mono);font-size:11.5px">${esc(n.anchor_kind || "")}</span></div>
      <div class="kv"><span>节点角色</span><span style="font-family:var(--mono);font-size:11.5px">${esc(n.node_role || "")}</span></div>
      <div class="kv"><span>布局泳道</span><span style="font-family:var(--mono);font-size:11.5px">${esc(n.layout_lane || "")}</span></div>
    </div>
    <div class="d-sec"><h3>内容</h3><div class="d-desc">${esc(n.effect_summary)}</div></div>
    <div class="d-sec"><h3>机会成本</h3><div class="d-desc">${esc(n.opportunity_cost || "无")}</div></div>
    ${unlockBlock}
    ${renderContentEffects(n.content_effects)}
    <div class="d-sec"><h3>硬前置 · 全部必须完成</h3><div>${prereqs}</div></div>
    <div class="d-sec"><h3>替代知识路径</h3>${research}</div>
    ${milestoneBlock}
    <div class="d-sec"><h3>发现启发 · 仅用于揭示</h3>${inspiration}</div>
    <div class="d-sec"><h3>数值效果 · 永久修正</h3>${terms}</div>
    <div class="d-sec"><h3>主题路线后继</h3><div>${sameLane}</div></div>
    ${applicationBlock}
    <div class="d-sec"><h3>被以下科技作为硬前置</h3><div>${succs}</div></div>
    ${n.terminal_reason ? `<div class="d-sec"><h3>终点理由</h3><div class="d-desc">${esc(n.terminal_reason)}</div></div>` : ""}`;
  detail.scrollTop = 0;
  detail.querySelectorAll("[data-goto]").forEach(el => el.addEventListener("click", ev => {
    ev.stopPropagation();
    const id = el.getAttribute("data-goto");
    select(id);
    nodeEls[id].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  }));
}

document.getElementById("scroller").addEventListener("click", ev => {
  if (ev.target.closest(".node")) return;
  clearSelection();
  renderOverview();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { clearSelection(); renderOverview(); } });

// ── 顶部：时代导航 / 图例 / 搜索 / 缩放 ──
const eraNav = document.getElementById("era-nav");
DATA.eras.forEach((era, col) => {
  const tab = document.createElement("span");

  tab.innerHTML = `${era.display_name}<b>${era.node_count}</b>`;

const legend = document.getElementById("legend");
const domainOn = {};
DATA.domains.forEach(d => {
  domainOn[d.id] = true;
  const count = DATA.nodes.filter(n => n.domain_id === d.id).length;
  const el = document.createElement("span");
  el.className = "legend-chip";
  el.innerHTML = `<span class="dot" style="background:${d.accent}"></span>${d.display_name}<b>${count}</b>`;
  el.addEventListener("click", () => {
    domainOn[d.id] = !domainOn[d.id];
    el.classList.toggle("off", !domainOn[d.id]);
    DATA.nodes.forEach(n => nodeEls[n.id].style.visibility = domainOn[n.domain_id] ? "visible" : "hidden");
    edgeEls.forEach(e => e.style.visibility =
      domainOn[nodesById[e.dataset.from].domain_id] && domainOn[nodesById[e.dataset.to].domain_id]
        ? "visible" : "hidden");
  });
  legend.appendChild(el);
});

const EDGE_META = {
  hard: ["硬前置", ""],
  application: ["应用交汇", "application"],
  alternative: ["替代说明", "alternative"],
  milestone_candidate: ["里程碑候选", "milestone_candidate"],
};
const edgeOn = { hard: true, application: false, alternative: false, milestone_candidate: false };
const edgeLegend = document.getElementById("edge-legend");
Object.entries(EDGE_META).forEach(([kind, meta]) => {
  const count = DATA.edges.filter(e => e.kind === kind && isDrawnEdge(e)).length;
  const el = document.createElement("span");
  el.className = "edge-chip" + (edgeOn[kind] ? "" : " off");
  el.innerHTML = `<span class="edge-swatch ${meta[1]}"></span>${meta[0]}<b>${count}</b>`;
  el.title = count
    ? (edgeOn[kind] ? `显示或隐藏${meta[0]}边` : `默认隐藏${meta[0]}，点选节点时会临时显示；点击打开全部`)
    : `当前目录没有${meta[0]}边`;
  if (!count) el.classList.add("off");
  el.addEventListener("click", () => {
    if (!count) return;
    edgeOn[kind] = !edgeOn[kind];
    el.classList.toggle("off", !edgeOn[kind]);
    edgeEls.forEach(edge => {
      if (edge.dataset.kind === kind) edge.classList.toggle("filtered", !edgeOn[kind]);
    });
  });
  edgeLegend.appendChild(el);
});
edgeEls.forEach(edge => edge.classList.toggle("filtered", !edgeOn[edge.dataset.kind]));

const searchInput = document.getElementById("search");
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  DATA.nodes.forEach(n => nodeEls[n.id].classList.remove("search-hit"));
  if (!q) return;
  DATA.nodes.forEach(n => {
    if (n.display_name.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)
        || n.route_tags.some(t => t.toLowerCase().includes(q))
        || n.effect_summary.toLowerCase().includes(q)
        || (n.content_effects || []).some(e => String(e.display_name || e.id).toLowerCase().includes(q))
        || n.modifier_terms.some(t => String(t.subject_display_name || t.stat).toLowerCase().includes(q)))
      nodeEls[n.id].classList.add("search-hit");
  });
});
searchInput.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const hit = DATA.nodes.find(n => nodeEls[n.id].classList.contains("search-hit"));
  if (hit) { select(hit.id); nodeEls[hit.id].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" }); }
});

document.querySelectorAll("#zoom-seg button").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll("#zoom-seg button").forEach(b => b.classList.toggle("on", b === btn));
  currentZoom = parseFloat(btn.dataset.zoom);
  wrap.style.transform = `scale(${currentZoom})`;
  applyStageSize();
}));

let resizeTimer = 0;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(relayout, 80);
}).observe(document.getElementById("scroller"));

// ── 工具函数 ──
function fmtCost(v) {
  if (v >= 100000000) return trimNum(v / 100000000) + " 亿";
  if (v >= 10000) return trimNum(v / 10000) + " 万";
  return v.toLocaleString("zh-CN");
}
function trimNum(x) { return x.toFixed(x >= 100 ? 0 : x >= 10 ? 1 : 2).replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1"); }
function fmtTerm(t) {
  if (t.operation === 0) return "+" + (t.value * 100).toFixed(1).replace(/\.0$/, "") + "%";
  if (t.operation === 1) return "−" + (t.value * 100).toFixed(1).replace(/\.0$/, "") + "%";
  if (t.operation === 2) return "× " + t.value;
  if (t.operation === 3) return "÷ " + t.value;
  return String(t.value);
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

} else {

}
