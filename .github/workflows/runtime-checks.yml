name: Runtime quick checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep checks for each new commit on master in a separate group.
  group: runtime-quick-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Text-only guards: sources, scripts and agent skills; no assets or binaries.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ci/
            /tools/factory/
            /tools/perf/
            /gdext/src/
            /gdext/tests/
            /Project/project-keynes/**/*.gd
            /Project/project-keynes/data/native_binding_manifest.json
            /Project/project-keynes/tools/technology_tree/building_distinction_review.json
            /skills/
            /docs/architecture/
            /docs/plans/
            /docs/factory/
            /AGENTS.md
            /.github/workflows/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static architecture guards
        working-directory: tools/ci
        run: |
          status=0
          for guard in check_size_ratchet.py check_cpp_deps.py check_cross_domain_inventory.py \
              check_runtime_advancers.py check_runtime_switches.py check_committed_views.py \
              check_save_contracts.py check_module_contracts.py check_resolve_apply.py \
              check_module_api.py check_skill_mirrors.py check_module_map.py world_ext_bindings.py check_world_ext_bindings.py check_script_native_access.py test_architecture_guards.py \
              test_regression_evidence.py test_runtime_load_consistency.py; do
            echo "::group::$guard"
            python "$guard" || { status=1; echo "::error::$guard failed"; }
            echo "::endgroup::"
          done
          exit $status
      - name: Factory tests
        if: success() || failure()
        # poll.sh runs under zsh on macOS; the poll-script tests need it here too.
        run: |
          sudo apt-get install -y -qq zsh >/dev/null
          python -m unittest discover -s tools/factory/tests -v
      - name: Performance comparison tests
        if: success() || failure()
        run: python -m unittest discover -s tools/perf/tests -p 'test_perf_change*.py' -v
  authoring-and-thread-lifetime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not download game assets, checked-in binaries or godot-cpp.
          sparse-checkout: |
            tools/map_authoring
            gdext/src
            gdext/tests
            gdext/thirdparty/simulation_math
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Map authoring regressions
        run: python -m unittest discover -s tools/map_authoring/tests -v
      - name: Thread retirement under address and undefined behavior sanitizers
        run: |
          clang++ -std=c++17 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            -Igdext/src gdext/tests/runtime_thread_retirement_test.cpp -o /tmp/thread-retirement-test
          /tmp/thread-retirement-test
      - name: In-flight execution ownership during stop
        run: |
          clang++ -std=c++17 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            -Igdext/src gdext/tests/runtime_execution_context_test.cpp -o /tmp/execution-context-test
          /tmp/execution-context-test
      - name: Control notification at the check-to-wait boundary
        run: |
          clang++ -std=c++17 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            -Igdext/src gdext/tests/runtime_control_wakeup_test.cpp -o /tmp/control-wakeup-test
          /tmp/control-wakeup-test
          clang++ -std=c++17 -pthread -Igdext/src gdext/tests/runtime_worker_timing_test.cpp \
            -o /tmp/worker-timing-test
          /tmp/worker-timing-test
      - name: Concurrent kernel dispatch and sparse byte hashing
        run: |
          clang++ -std=c++17 -pthread -fsanitize=address,undefined -Igdext/src \
            gdext/tests/native_parallel_executor_test.cpp gdext/src/native_parallel_executor.cpp \
            -o /tmp/parallel-executor-test
          /tmp/parallel-executor-test
          clang++ -std=c++17 -O2 -Igdext/src gdext/tests/economy_hash_lanes_test.cpp -o /tmp/hash-lanes-test
          /tmp/hash-lanes-test
          clang++ -std=c++17 -pthread -fsanitize=address,undefined -Igdext/src \
            gdext/tests/economy_resource_projection_test.cpp -o /tmp/economy-resource-projection-test
          /tmp/economy-resource-projection-test
      - name: Standalone climate compilation
        run: |
          printf '#include "runtime_climate_pass_math.h"\n' | g++ -std=c++17 -fsyntax-only -x c++ -Igdext/src -
          g++ -std=c++17 -fsyntax-only -Igdext/src gdext/src/runtime_climate_kernel.cpp gdext/src/runtime_climate_input_hash.cpp
