name: Runtime quick checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Text-only guards: sources, scripts and agent skills; no assets or binaries.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ci/
            /gdext/src/
            /gdext/tests/
            /Project/project-keynes/**/*.gd
            /Project/project-keynes/data/native_binding_manifest.json
            /.*/skills/
            /docs/architecture/
            /.github/workflows/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static architecture guards
        working-directory: tools/ci
        run: |
          status=0
          for guard in check_size_ratchet.py check_cpp_deps.py check_cross_domain_inventory.py \
              check_runtime_advancers.py check_runtime_switches.py check_committed_views.py \
              check_save_contracts.py check_module_contracts.py check_resolve_apply.py \
              check_module_api.py check_skill_mirrors.py check_module_map.py world_ext_bindings.py check_world_ext_bindings.py check_script_native_access.py test_architecture_guards.py \
              test_regression_evidence.py; do
            echo "::group::$guard"
            python "$guard" || { status=1; echo "::error::$guard failed"; }
            echo "::endgroup::"
          done
          exit $status
  authoring-and-thread-lifetime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not download game assets, checked-in binaries or godot-cpp.
          sparse-checkout: |
            tools/map_authoring
            gdext/src
            gdext/tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Map authoring regressions
        run: python -m unittest discover -s tools/map_authoring/tests -v
      - name: Thread retirement under address and undefined behavior sanitizers
        run: |
          clang++ -std=c++17 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            -Igdext/src gdext/tests/runtime_thread_retirement_test.cpp -o /tmp/thread-retirement-test
          /tmp/thread-retirement-test
      - name: In-flight execution ownership during stop
        run: |
          clang++ -std=c++17 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            -Igdext/src gdext/tests/runtime_execution_context_test.cpp -o /tmp/execution-context-test
          /tmp/execution-context-test
      - name: Control notification at the check-to-wait boundary
        run: |
          clang++ -std=c++17 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            -Igdext/src gdext/tests/runtime_control_wakeup_test.cpp -o /tmp/control-wakeup-test
          /tmp/control-wakeup-test
      - name: Standalone climate compilation
        run: |
          printf '#include "runtime_climate_pass_math.h"\n' | g++ -std=c++17 -fsyntax-only -x c++ -Igdext/src -
          g++ -std=c++17 -fsyntax-only -Igdext/src gdext/src/runtime_climate_kernel.cpp
