name: Runtime regression checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring-and-thread-lifetime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Map authoring regressions
        run: python -m unittest discover -s tools/map_authoring/tests -v
      - name: Thread retirement under address and undefined behavior sanitizers
        run: |
          clang++ -std=c++17 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            -Igdext/src gdext/tests/runtime_thread_retirement_test.cpp -o /tmp/thread-retirement-test
          /tmp/thread-retirement-test
      - name: In-flight execution ownership during stop
        run: |
          clang++ -std=c++17 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -g \
            -Igdext/src gdext/tests/runtime_execution_context_test.cpp -o /tmp/execution-context-test
          /tmp/execution-context-test

  godot-runtime:
    runs-on: ubuntu-latest
    env:
      GODOT_RELEASE: "4.6.3-stable"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tool
        run: python -m pip install scons
      - name: Build native extension from the pinned submodule
        working-directory: gdext
        run: scons platform=linux target=template_debug arch=x86_64 dev_build=no -j2
      - name: Download Godot
        run: |
          curl --fail --location --output /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64"
          echo "GODOT_BIN=/tmp/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import and run focused runtime and save checks
        run: python tools/ci/run_regression_checks.py --import --roundtrip --log-dir /tmp/runtime-check-logs
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-check-logs
          path: /tmp/runtime-check-logs
          if-no-files-found: ignore
